# bunnyauto environment overlay — copy to bunnyauto.yaml and fill in your URLs.
#
# This file is layered on top of the Nornir config.yaml. It defines the named
# networks bunnyauto can target. Every run must pick one with --env (the hub
# asks; CI names it per pipeline stage) — there is no default.
#
# Each environment bundles the things that must move together:
#   nb_url        the NetBox instance for that network
#   default_tag   the NetBox tag --tag falls back to for that environment
#   token_env     the environment variable holding that instance's API token
#   protected     optional; true means an --apply needs a typed confirmation
#   fw_url        optional; base URL of that network's FortiGate REST API
#   fw_token_env  optional; env var holding that firewall's API token
#                 (required if fw_url is set — used by `security subnet-check`).
#                 Read access is enough to check a subnet; creating the address
#                 object it offers for a free one needs read-write access to
#                 firewall addresses.
#   aruba_url     optional; base URL of that network's Aruba Mobility Conductor
#                 REST API (include :4343 if that is the API port). Used by
#                 `wireless sync`, which also logs into each WLC the Conductor
#                 reports (port 4343 unless --wlc-port). Auth is the shared
#                 device login (NORNIR_USERNAME / NORNIR_PASSWORD) — no separate
#                 token — and TLS certificates are verified unless
#                 --aruba-insecure / --wlc-insecure.
#   roles         optional; per-environment override of the top-level roles:
#                 block below, for a NetBox whose role slugs differ.
#
# Device credentials (NORNIR_USERNAME / NORNIR_PASSWORD) and firewall tokens are
# never written here — only the *names* of the variables that hold them.

# Tool categories and NetBox device roles (NetBox 4.3+ nested roles).
#
# Every tool belongs to a category — `bunnyauto --env <env> <category> <tool>` —
# and a wired / wireless / security tool only ever touches devices that carry the
# environment's default_tag AND whose NetBox role sits in that category's branch
# of the role tree (the branch root or any role beneath it):
#
#   Networking
#   ├── Wired Network      -> wired      Routing, Switching > Core > Distribution > Access
#   ├── Wireless Network   -> wireless   Wireless Controller > Wireless Access Point
#   └── Network Security   -> security   Firewalls
#
# The defaults below are NetBox's auto-generated slugs for those names — only
# add this block (or just the keys that differ) if yours are different.
# `bunnyauto --env <env> netbox scope` shows what each category reaches.
#
# roles:
#   wired: wired-network                          # wired branch root
#   wireless: wireless-network                    # wireless branch root
#   security: network-security                    # security branch root
#   wireless-controller: wireless-controller      # WLCs: `wireless sync` creates these
#   wireless-access-point: wireless-access-point  # APs: `wireless sync` creates these

environments:

  test:
    nb_url: https://netbox-lab.example.com
    default_tag: nornirtest
    token_env: BUNNYAUTO_TEST_NB_TOKEN

  prod:
    nb_url: https://netbox.example.com
    default_tag: networking-active
    token_env: BUNNYAUTO_PROD_NB_TOKEN
    protected: true
    fw_url: https://fortigate.example.com
    fw_token_env: BUNNYAUTO_PROD_FW_TOKEN
    aruba_url: https://aruba-conductor.example.com:4343
